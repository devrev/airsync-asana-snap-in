version: 1
connector:
  entrypoint: ../../dist/index.js
  function: extraction
stages:
  - metadata_extraction
connection_data:
  org_id: workspace-synthetic
  org_name: Synthetic component test
  key: synthetic-component-token
  key_type: pat
event_context:
  external_sync_unit_id: project-synthetic
  external_sync_unit_name: Synthetic scope
  import_slug: asana
limits:
  max_invocations: 3
  invocation_timeout_ms: 30000
  scenario_timeout_ms: 60000
mock_server:
  config: mock-server.yaml
  scenario: happy
  health_path: /admin/config
schema:
  edm:
    filename: "*external_domain_metadata*"
  context:
    schema_variant: metadata-base
    connection: asana-synthetic
    external_sync_unit: project-synthetic
  checks:
    - consistency
    - chef
assertions:
  schema:
    edm:
      - path: record_types
        count: 9
      - path: record_types.tasks.fields.name.type
        equals: text
      - path: record_types.tasks.fields.9001
        absent: true
      - path: record_types.tasks.stage_diagram
        absent: true
      - path: record_types.subtasks.fields.completed_stage.enum.values
        equals:
          - key: open
            name: Open
          - key: completed
            name: Completed
    idm:
      - path: additional_mappings.record_type_mappings.tasks
        exists: true
      - path: additional_mappings.record_type_mappings.subtasks
        exists: true
    installations:
      - count: 1
  callbacks:
    match:
      - count: 1
      - contains:
          event_type: METADATA_EXTRACTION_DONE
